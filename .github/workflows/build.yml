name: build

on:
  push:
  pull_request:

jobs:
  studio:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: Test Studio
        run: dotnet test MusicLibraryManager.Studio.Tests/MusicLibraryManager.Studio.Tests.csproj --configuration Release
      - name: Package Studio
        run: MusicLibraryManager.Studio\Package.cmd -Version "1.0.0-ci.${{ github.run_number }}" -NoRestore
      - name: Upload Studio package
        uses: actions/upload-artifact@v7
        with:
          name: MusicLibraryManager.Studio-win-x64
          path: |
            .artifacts/studio/*.zip
            .artifacts/studio/*.sha256
          if-no-files-found: error

  portable:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: Install ffmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Verify ffmpeg
        run: ffmpeg -version
      - name: Build portable projects
        run: dotnet build MusicLibraryTools.Portable.slnf --configuration Release
      - name: Test
        run: dotnet test MusicLibraryTools.Portable.slnf --configuration Release --no-build

  avalonia-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: Test native Studio
        shell: pwsh
        run: dotnet test MusicLibraryManager.Studio.Avalonia.Tests/MusicLibraryManager.Studio.Avalonia.Tests.csproj --configuration Release
      - name: Package native Studio
        shell: pwsh
        run: ./MusicLibraryManager.Studio.Avalonia/Package.ps1 -Version "1.0.0-ci.${{ github.run_number }}" -Rids ${{ matrix.rid }}
      - name: Upload native Studio package
        uses: actions/upload-artifact@v7
        with:
          name: MusicLibraryManager.Studio.Avalonia-${{ matrix.rid }}
          path: |
            .artifacts/studio-avalonia/*.zip
            .artifacts/studio-avalonia/*.tar.gz
            .artifacts/studio-avalonia/*.sha256
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      CI: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.301
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Verify ffmpeg
        run: ffmpeg -version
      - name: Build portable projects
        run: dotnet build MusicLibraryTools.Portable.slnf --configuration Release
      - name: Test
        run: dotnet test MusicLibraryTools.Portable.slnf --configuration Release --no-build
