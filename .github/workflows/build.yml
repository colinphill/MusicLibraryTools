name: build

on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.301
      - name: Install ffmpeg
        run: choco install ffmpeg --yes --no-progress
      - name: Verify ffmpeg
        run: ffmpeg -version
      - name: Build portable projects
        run: dotnet build MusicLibraryTools.Portable.slnf --configuration Release
      - name: Test
        run: dotnet test MusicLibraryTools.Portable.slnf --configuration Release --no-build
