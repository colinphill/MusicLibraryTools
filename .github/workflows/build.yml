name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  AVALONIA_TELEMETRY_OPTOUT: 1
  CI: true
  NDK_VERSION: 27.3.13750724

jobs:
  portable:
    name: Portable build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve syncer revision
        id: syncer_ref
        shell: pwsh
        run: '"revision=$(git rev-parse HEAD:syncer)" >> $env:GITHUB_OUTPUT'

      - name: Check out syncer submodule
        uses: actions/checkout@v7
        with:
          repository: colinphill/syncer
          ref: ${{ steps.syncer_ref.outputs.revision }}
          path: syncer
          ssh-key: ${{ secrets.SYNCER_SSH_KEY }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Build portable projects
        run: dotnet build MusicLibraryTools.Portable.slnf --configuration Release

      - name: Test portable projects
        run: dotnet test MusicLibraryTools.Portable.slnf --configuration Release --no-build --no-restore

  syncer-runtime:
    name: Build Android syncer runtime
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve syncer revision
        id: syncer_ref
        shell: pwsh
        run: '"revision=$(git rev-parse HEAD:syncer)" >> $env:GITHUB_OUTPUT'

      - name: Check out syncer submodule
        uses: actions/checkout@v7
        with:
          repository: colinphill/syncer
          ref: ${{ steps.syncer_ref.outputs.revision }}
          path: syncer
          ssh-key: ${{ secrets.SYNCER_SSH_KEY }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Select Android NDK
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (-not $sdkRoot) { throw 'The runner does not provide an Android SDK.' }
          $ndk = Join-Path $sdkRoot "ndk/$env:NDK_VERSION"
          if (-not (Test-Path $ndk)) {
            $sdkManagerCommand = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue
            $sdkManagerPath = if ($sdkManagerCommand) {
              $sdkManagerCommand.Source
            } else {
              Join-Path $sdkRoot 'cmdline-tools/latest/bin/sdkmanager.bat'
            }
            if (-not (Test-Path $sdkManagerPath)) { throw 'sdkmanager.bat was not found.' }
            & $sdkManagerPath --install "ndk;$env:NDK_VERSION"
            if ($LASTEXITCODE -ne 0) { throw "Android NDK installation failed with exit code $LASTEXITCODE." }
          }
          "ANDROID_NDK_HOME=$ndk" >> $env:GITHUB_ENV

      - name: Build native clients and all Android ABIs
        shell: pwsh
        working-directory: syncer
        run: ./scripts/build-package.ps1 -Configuration Release

      - name: Test native syncer
        shell: pwsh
        run: ctest --test-dir syncer/out/build/windows -C Release --output-on-failure

      - name: Build and test managed syncer
        run: |
          dotnet restore syncer/managed/Syncer.Managed.slnx
          dotnet build syncer/managed/Syncer.Managed.slnx --configuration Release --no-restore
          dotnet test syncer/managed/Syncer.Managed.slnx --configuration Release --no-build --no-restore

      - name: Upload Android server set
        uses: actions/upload-artifact@v7
        with:
          name: syncer-android-servers
          path: syncer/out/package/syncer-Release/servers
          if-no-files-found: error
          retention-days: 7

  manager-packages:
    name: Manager package (${{ matrix.rid }})
    needs: [portable, syncer-runtime]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
          - os: ubuntu-24.04
            rid: linux-x64
          - os: macos-14
            rid: osx-arm64
          - os: macos-14
            rid: osx-x64
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve syncer revision
        id: syncer_ref
        shell: pwsh
        run: '"revision=$(git rev-parse HEAD:syncer)" >> $env:GITHUB_OUTPUT'

      - name: Check out syncer submodule
        uses: actions/checkout@v7
        with:
          repository: colinphill/syncer
          ref: ${{ steps.syncer_ref.outputs.revision }}
          path: syncer
          ssh-key: ${{ secrets.SYNCER_SSH_KEY }}
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download Android server set
        uses: actions/download-artifact@v8
        with:
          name: syncer-android-servers
          path: .ci/syncer-runtime/servers

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress

      - name: Test Music Library Manager UI
        run: dotnet test MusicLibraryManager.UI.Tests/MusicLibraryManager.UI.Tests.csproj --configuration Release

      - name: Package Music Library Manager
        shell: pwsh
        run: ./MusicLibraryManager/Package.ps1 -Version "0.0.0-ci.${{ github.run_number }}" -Rids ${{ matrix.rid }} -SyncerRuntimeRoot .ci/syncer-runtime -Installers

      - name: Sign in to Azure for Artifact Signing
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Resolve Artifact Signing profile
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        id: artifact_signing
        shell: pwsh
        run: ./MusicLibraryManager/Resolve-ArtifactSigning.ps1 -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" -OutputFile $env:GITHUB_OUTPUT

      - name: Create Windows signing catalog
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation CreateCatalog -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Sign Windows application binaries
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.artifact_signing.outputs.endpoint }}
          signing-account-name: ${{ steps.artifact_signing.outputs.account_name }}
          certificate-profile-name: ${{ steps.artifact_signing.outputs.profile_name }}
          files-catalog: ${{ github.workspace }}\.artifacts\music-library-manager\0.0.0-ci.${{ github.run_number }}\win-x64\authenticode-payload.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Music Library Manager
          description-url: https://github.com/colinphill/MusicLibraryTools
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signed Windows application binaries
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation Verify -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Prepare signed Windows uninstaller
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation PrepareSignedUninstaller -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Sign Windows uninstaller
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.artifact_signing.outputs.endpoint }}
          signing-account-name: ${{ steps.artifact_signing.outputs.account_name }}
          certificate-profile-name: ${{ steps.artifact_signing.outputs.profile_name }}
          files-catalog: ${{ github.workspace }}\.artifacts\music-library-manager\0.0.0-ci.${{ github.run_number }}\win-x64\authenticode-uninstaller-payload.txt
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Music Library Manager uninstaller
          description-url: https://github.com/colinphill/MusicLibraryTools
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signed Windows uninstaller
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation Verify -Version "0.0.0-ci.${{ github.run_number }}" -IncludeUninstaller

      - name: Rebuild Windows package from signed binaries
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation RebuildArtifacts -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Sign Windows installer
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ steps.artifact_signing.outputs.endpoint }}
          signing-account-name: ${{ steps.artifact_signing.outputs.account_name }}
          certificate-profile-name: ${{ steps.artifact_signing.outputs.profile_name }}
          files: ${{ github.workspace }}\.artifacts\music-library-manager\MusicLibraryManager-0.0.0-ci.${{ github.run_number }}-win-x64-setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Music Library Manager installer
          description-url: https://github.com/colinphill/MusicLibraryTools
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify signed Windows package
        if: runner.os == 'Windows' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./MusicLibraryManager/WindowsPackageSigning.ps1 -Operation Verify -Version "0.0.0-ci.${{ github.run_number }}" -IncludeUninstaller -IncludeInstaller -WriteChecksums

      - name: Upload Music Library Manager package
        uses: actions/upload-artifact@v7
        with:
          name: MusicLibraryManager-${{ matrix.rid }}
          path: |
            .artifacts/music-library-manager/*.zip
            .artifacts/music-library-manager/*.tar.gz
            .artifacts/music-library-manager/*.exe
            .artifacts/music-library-manager/*.deb
            .artifacts/music-library-manager/*.dmg
            .artifacts/music-library-manager/*.sha256
          if-no-files-found: error
          retention-days: 14
